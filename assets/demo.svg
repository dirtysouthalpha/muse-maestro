<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 365" width="940" height="365" role="img" aria-label="terminal demo: maestro-guardrail — PreToolUse blocks rm -rf ~/">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="937" height="362" rx="12" fill="#12121A" stroke="url(#edge)" stroke-width="1.5" stroke-opacity="0.55"/>
  <rect x="1.5" y="1.5" width="937" height="38" rx="12" fill="#1b1b26"/>
  <rect x="1.5" y="26" width="937" height="14" fill="#1b1b26"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="48" cy="20" r="6" fill="#ffbd2e"/><circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="470" y="25" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#6B7280" text-anchor="middle">maestro-guardrail — PreToolUse blocks rm -rf ~/</text>
  <text x="28" y="64" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" opacity="0"><tspan fill="#22D3EE" font-weight="700">❯</tspan><tspan fill="#6B7280"> ~ </tspan><tspan fill="#E8E8F0">echo &#x27;{&quot;tool_name&quot;:&quot;bash&quot;,&quot;tool_input&quot;:</tspan><animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.12s" fill="freeze"/></text><text x="28" y="89" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#6B7280" font-weight="400" opacity="0">        {&quot;command&quot;:&quot;rm -rf ~/&quot;}}&#x27; | node guardrail.mjs<animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.18s" fill="freeze"/></text><text x="28" y="139" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#E8E8F0" font-weight="400" opacity="0">{&quot;hookSpecificOutput&quot;:{&quot;permissionDecision&quot;:&quot;deny&quot;,<animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.18s" fill="freeze"/></text><text x="28" y="164" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#f87171" font-weight="700" opacity="0">  &quot;permissionDecisionReason&quot;:&quot;maestro-guardrail: blocked<animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.18s" fill="freeze"/></text><text x="28" y="189" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#f87171" font-weight="700" opacity="0">  [rm-rf-recursive-force-root] Recursive delete aimed at a<animate attributeName="opacity" from="0" to="1" begin="2.75s" dur="0.18s" fill="freeze"/></text><text x="28" y="214" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#f87171" font-weight="700" opacity="0">  root / home / system path or ~. This op is denied as<animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.18s" fill="freeze"/></text><text x="28" y="239" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#f87171" font-weight="700" opacity="0">  irreversible/destructive. ...&quot;}}<animate attributeName="opacity" from="0" to="1" begin="3.85s" dur="0.18s" fill="freeze"/></text><text x="28" y="289" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#6B7280" font-weight="400" opacity="0"># safe ops stay silent (= allowed); only catastrophe is denied<animate attributeName="opacity" from="0" to="1" begin="4.95s" dur="0.18s" fill="freeze"/></text><text x="28" y="314" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" opacity="0"><tspan fill="#22D3EE" font-weight="700">❯</tspan><tspan fill="#6B7280"> ~ </tspan><tspan fill="#E8E8F0"></tspan><animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.12s" fill="freeze"/></text><rect x="28" y="301" width="9" height="17" fill="#22D3EE" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.8s" dur="0.15s" fill="freeze"/><animate attributeName="opacity" values="1;1;0;0;1" dur="1s" begin="6.1s" repeatCount="indefinite"/></rect>
</svg>
